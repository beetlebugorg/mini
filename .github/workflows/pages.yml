name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The docs are static. The Mini page is the home page. The large Bluespeaker
      # page moves to bluespeaker.html.
      - name: Stage the site
        run: |
          mkdir -p _site
          cp -r docs/. _site/
          rm -rf _site/lineart/raw _site/lineart/node_modules
          mv _site/index.html _site/bluespeaker.html
          sed 's#href="index.html"#href="bluespeaker.html"#' docs/mini.html > _site/index.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
